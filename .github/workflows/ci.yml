name: MatabAI CI & Security Hardening Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Test, Audit & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Environment Schema
        run: node scripts/verify-env.mjs

      - name: Verify Database Constraints & RLS
        run: node scripts/db-verify-constraints.mjs

      - name: Build Shared Packages
        run: pnpm run build:packages

      - name: Generate Prisma Client
        run: pnpm run db:generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/test?schema=public"

      - name: Type Check Monorepo
        run: pnpm run typecheck

      - name: Lint Monorepo
        run: pnpm run lint

      - name: Monorepo Unit & Integration Tests
        run: pnpm run test

      - name: Build Backend API (apps/api)
        run: pnpm run build:api

      - name: Build Frontend Web (apps/web)
        run: pnpm run build:web
        env:
          NEXT_PUBLIC_APP_NAME: "MatabAI (ShifaDesk)"
          NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"

      - name: Dependency Vulnerability Audit
        run: pnpm audit --prod --audit-level critical || true
